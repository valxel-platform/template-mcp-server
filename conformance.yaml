# The template conformance suite (.github/scripts/conformance.py, managed by the platform): the built
# image does what every MCP server repo must. A tool is called with a token like an agent's.
image: "ci"  # the tag CI builds
command: "uv run mcp-server"  # conformance.py local: the app as a process
# /metrics is on the management port (MANAGEMENT_PORT, 8081), apart from the API.
metrics: http://127.0.0.1:8081/metrics
port: 8080
audience: http://127.0.0.1:8080/mcp
env:
  MCP_RESOURCE_URL: http://127.0.0.1:8080/mcp
  MCP_OIDC_ISSUER: "{issuer}"
  MCP_OIDC_JWKS_URL: "{jwks}"
  MCP_FLAGS_URL: "{ofrep}"
  MCP_PRODUCT: conformance
  MCP_ENVIRONMENT: ci
  MCP_AUDIT_SINK: log
steps:
  - method: POST
    path: /mcp
    token: {scope: "care:read care:write", organization: {north-clinic: {}}}
    headers: {accept: "application/json, text/event-stream"}
    json: {jsonrpc: "2.0", id: 1, method: tools/call,
           params: {name: find_patient, arguments: {name: "Ana Lopez", date_of_birth: "1984-03-02"}}}
    contains: ['"found"']
# find_patient reads the example feature's flag (server.example_flag) through OFREP.
checks: [audit, tracing, events, flags]
