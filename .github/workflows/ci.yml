# Required checks on the default branch: unit (and CodeQL, from default setup).
# Job names are the check names the Vrixel SDLC and the branch ruleset look for; keep them.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REPORT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m 'not evals'
      - name: Report results
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/report.py --context "unit / report" --junit reports/junit.xml --cobertura coverage.xml

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # OpenChoreo builds and ships the image; this proves it builds, starts and has no known
      # high or critical vulnerabilities with a fix available, on every PR.
      - run: docker build --pull -t ci .
      - name: Start the image
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e MCP_OIDC_ISSUER=https://id.example.com/realms/ci \
            -e MCP_OIDC_JWKS_URL=https://id.example.com/realms/ci/certs ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1
      # Syft and Grype run as containers (pinned versions), not as marketplace actions.
      - name: Software bill of materials
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/syft:v1.57.1 \
            docker:ci -o cyclonedx-json > sbom.cyclonedx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 30
      - name: Scan for vulnerabilities with a fix
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/grype:v0.121.3 \
            docker:ci --only-fixed --fail-on high

